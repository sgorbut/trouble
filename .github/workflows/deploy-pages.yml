# Сборка web-версии и публикация PWA на GitHub Pages при каждом push в main.
# Один раз в настройках репозитория: Settings → Pages → Source: GitHub Actions.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      # Личных имён в репозитории нет — берём образец с пустым списком.
      - run: cp lib/ui/quick_names.example.dart lib/ui/quick_names.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # base-href = /<имя репозитория>/; движок отрисовки — с того же сайта (для офлайна).
      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --no-web-resources-cdn

      # Новая версия кэша service worker на каждый деплой — старый кэш удаляется.
      - run: sed -i "s/trouble-v1/trouble-${GITHUB_SHA::8}/" build/web/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
